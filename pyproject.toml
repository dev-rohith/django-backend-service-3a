[project]
name = "docstore"
version = "0.1.0"
description = "Django backend service for document storage and query history"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.30.0",
    "anthropic>=0.50",
    "faiss-cpu>=1.8",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "numpy>=1.26",
    "pypdf>=4.0",
    "requests>=2.31",
    "sentence-transformers>=3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.12",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
